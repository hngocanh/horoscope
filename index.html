<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Daily Horoscope</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Welcome to Your Daily Horoscope</h1>
      <p class="subtitle">Discover what the stars have in store for you</p>
    </header>

    <div class="progress">
      <div class="progress-dot active"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
    </div>

    <div class="card-grid">
      <div class="card" data-gender="male" onclick="selectGender('male')">
        <div class="card-icon"></div>
        <div class="card-title">Male</div>
      </div>
      <div class="card" data-gender="female" onclick="selectGender('female')">
        <div class="card-icon"></div>
        <div class="card-title">Female</div>
      </div>
    </div>

    <div class="button-container">
      <button class="btn" id="continueBtn" disabled onclick="continueToZodiac()">Continue</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

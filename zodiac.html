<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Zodiac Sign</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Select Your Zodiac Sign</h1>
      <p class="subtitle">Find your sign and discover your destiny</p>
    </header>

    <div class="progress">
      <div class="progress-dot completed"></div>
      <div class="progress-dot active"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
    </div>

    <div class="zodiac-grid" id="zodiacGrid">
      <!-- Zodiac cards will be generated by JavaScript -->
    </div>

    <div class="button-container">
      <button class="btn" id="continueBtn" disabled onclick="continueToHoroscopeType()">Continue</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
